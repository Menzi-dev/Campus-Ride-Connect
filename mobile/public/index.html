<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect - Backend Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0a0a1a;
            color: #fff;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }
        .title {
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
            text-align: center;
            margin-bottom: 20px;
            margin-top: 0;
        }
        .card {
            background-color: #1a1a2e;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #2a2a4a;
            margin-bottom: 16px;
        }
        .status-label {
            color: #888;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .status-value {
            font-size: 16px;
            font-weight: bold;
        }
        .status-value.success {
            color: #4CAF50;
        }
        .status-value.error {
            color: #FF4444;
        }
        .message-card {
            border-color: #4CAF50 !important;
        }
        .message-text {
            text-align: center;
        }
        .button-container {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }
        button {
            padding: 16px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }
        button:hover:not(:disabled) {
            opacity: 0.8;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-primary {
            background-color: #4CAF50;
            color: #fff;
        }
        .btn-secondary {
            background-color: #2a2a4a;
            color: #fff;
        }
        .users-card {
            border-color: #2a2a4a;
        }
        .users-title {
            color: #4CAF50;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
            margin-top: 0;
        }
        .user-item {
            background-color: #0a0a1a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #2a2a4a;
        }
        .user-name {
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            margin-top: 0;
        }
        .user-email {
            color: #888;
            font-size: 14px;
            margin-bottom: 4px;
            margin-top: 0;
        }
        .user-role {
            color: #4CAF50;
            font-size: 12px;
            margin-top: 4px;
            margin-bottom: 0;
        }
        .hint {
            color: #666;
            font-size: 12px;
            text-align: center;
            margin-top: 20px;
            padding-bottom: 40px;
        }
        .hint code {
            background-color: #1a1a2e;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">🔗 Backend Connection Test</h1>

        <!-- Connection Status -->
        <div class="card">
            <p class="status-label">Status:</p>
            <p class="status-value" id="connectionStatus">Not tested</p>
        </div>

        <!-- Backend Message -->
        <div class="card message-card hidden" id="messageCard">
            <p class="message-text" id="backendMessage"></p>
        </div>

        <!-- Buttons -->
        <div class="button-container">
            <button class="btn-primary" id="testConnectionBtn" onclick="testConnection()">
                Test Connection
            </button>
            <button class="btn-secondary" id="testHelloBtn" onclick="testHello()">
                Test Hello
            </button>
            <button class="btn-secondary" id="getUsersBtn" onclick="getUsers()">
                Get Users
            </button>
        </div>

        <!-- Users List -->
        <div class="card users-card hidden" id="usersCard">
            <h2 class="users-title" id="usersTitle">👥 Users (0)</h2>
            <div id="usersList"></div>
        </div>

        <p class="hint">
            Backend API: <code>http://localhost:8080/api</code>
        </p>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8080/api';

        function setStatus(message, isSuccess = false) {
            const el = document.getElementById('connectionStatus');
            el.textContent = message;
            el.className = `status-value ${isSuccess ? 'success' : 'error'}`;
        }

        function setLoading(loading) {
            document.getElementById('testConnectionBtn').disabled = loading;
            document.getElementById('testHelloBtn').disabled = loading;
            document.getElementById('getUsersBtn').disabled = loading;
        }

        async function testConnection() {
            setLoading(true);
            try {
                const response = await fetch(`${API_BASE_URL}/test/connection`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                setStatus(`✅ ${data.status} - ${data.message}`, true);
                alert(`Success: Connected to ${data.database}`);
            } catch (error) {
                setStatus(`❌ Connection Failed: ${error.message}`);
                alert(`Error: Could not connect to backend: ${error.message}`);
            } finally {
                setLoading(false);
            }
        }

        async function testHello() {
            setLoading(true);
            try {
                const response = await fetch(`${API_BASE_URL}/test/hello`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const contentType = response.headers.get('content-type');
                let data;
                if (contentType && contentType.includes('application/json')) {
                    data = await response.json();
                } else {
                    data = await response.text();
                }
                document.getElementById('backendMessage').textContent = typeof data === 'string' ? data : JSON.stringify(data);
                document.getElementById('messageCard').classList.remove('hidden');
            } catch (error) {
                alert(`Error: ${error.message}`);
            } finally {
                setLoading(false);
            }
        }

        async function getUsers() {
            setLoading(true);
            try {
                const response = await fetch(`${API_BASE_URL}/users`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const users = await response.json();
                
                if (users.length > 0) {
                    document.getElementById('usersTitle').textContent = `👥 Users (${users.length})`;
                    const usersList = document.getElementById('usersList');
                    usersList.innerHTML = users.map((user, index) => `
                        <div class="user-item">
                            <p class="user-name">${user.fullName}</p>
                            <p class="user-email">${user.email}</p>
                            <p class="user-role">Role: ${user.role}</p>
                        </div>
                    `).join('');
                    document.getElementById('usersCard').classList.remove('hidden');
                } else {
                    alert('No users found');
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            } finally {
                setLoading(false);
            }
        }
    </script>
</body>
</html>
