# Backend settings: configure the server and its database/security behaviour. External environment
# and private configuration can provide local values.
# Where: backend/src/main/resources/application-dev.yml; Spring reads it at backend startup.
# How: Nested keys configure the datasource, server and other options present here. Environment
# references and imported private files supply the local values.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campus_connect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8080
  address: 0.0.0.0

app:
  jwt:
    secret: changeitchangemechangekey1234567890
    expiration-ms: 604800000   # 7 days