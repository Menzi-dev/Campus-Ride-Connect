# Test settings: keep database-backed checks on the dedicated test database rather than the normal
# application data.
# Tests must never register fixtures in the application's campus_connect database.
# Where: backend/src/test/resources/application.properties.
# How: Spring test startup reads these key/value settings, including the dedicated datasource URL,
# to isolate database-backed checks from the normal application database.
spring.datasource.url=jdbc:mysql://localhost:3306/campus_connect_tests?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.jpa.hibernate.ddl-auto=update
app.mail.disabled=true
# Automated backend tests must not launch a real camera-image matching process.
app.face-matcher.auto-start=false
app.mail.required=false
app.public-url=http://localhost:8085
spring.config.import=optional:file:./test-mail-not-configured.properties
